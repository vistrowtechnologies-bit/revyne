<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RevYne Brand v1</title>
<style>
  body { margin: 0; background: #14112A; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; font-weight: 600; margin: 16px; }
  .row { display: flex; gap: 16px; padding: 0 16px 24px; overflow-x: auto; align-items: flex-start; }
  figure { margin: 0; flex: 0 0 250px; }
  figure img { width: 250px; border-radius: 18px; display: block; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  figcaption { margin-top: 8px; font-weight: 600; }
</style>
</head>
<body>
  <h1>RevYne — brand palette redesign (v1, from Stitch)</h1>
  <div class="row">
    <figure><img src="brand-v1/stitch_revyne_business_reviews_app/revyne_home/screen.png" alt="Home"><figcaption>Home</figcaption></figure>
    <figure><img src="brand-v1/stitch_revyne_business_reviews_app/revyne_reviews/screen.png" alt="Reviews"><figcaption>Reviews</figcaption></figure>
    <figure><img src="brand-v1/stitch_revyne_business_reviews_app/revyne_get_reviews/screen.png" alt="Get Reviews"><figcaption>Get Reviews</figcaption></figure>
    <figure><img src="brand-v1/stitch_revyne_business_reviews_app/revyne_google/screen.png" alt="Google"><figcaption>Google</figcaption></figure>
  </div>
</body>
</html>
