<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; keep the leading/trailing slash. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RevYne for business owners: get genuine Google reviews, reply with AI drafts you approve, and manage your Google Business Profile.">
  <meta name="theme-color" content="#6334E2">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RevYne">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>RevYne</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Branded loading screen until Flutter draws its first frame. */
    html, body { height: 100%; margin: 0; }
    body { background: linear-gradient(135deg, #B02FE5, #6334E2 55%, #363DDD); }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: system-ui, sans-serif; color: #fff; }
    #boot img { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 12px 28px rgba(30, 11, 80, .35); }
    #boot b { font-size: 26px; letter-spacing: -.4px; }
    #boot i { width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; margin-top: 16px; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt=""><b>RevYne</b><i></i></div>
  <script>
    // Remove the loading screen once Flutter is up.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
